server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "node-logs"
    static_configs:
      - targets:
          - node-app
        labels:
          job: "node-app"
          __path__: /var/log/node-app/*.log

  - job_name: "minio-logs"
    static_configs:
      - targets:
          - minio
        labels:
          job: "minio"
          __path__: /var/log/minio/*.log
