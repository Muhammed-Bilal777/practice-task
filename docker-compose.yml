services:
  node-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-app
    ports:
      - "4040:4040"
    environment:
      MONGO_URI: "mongodb://mongo:27017/metaData?authSource=admin&directConnection=true"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      MINIO_PORT: 9000
      MINIO_END_POINT: minio
      OTEL_EXPORTER_ENDPOINT: "http://open-telemetry-collector:4317"

    depends_on:
      - minio
      - redis
      - mongo
      - open-telemetry-collector
      - zipkin

    env_file:
      - config/config.env
    volumes:
      - ./nodeLogs:/var/log/node-app
    networks:
      - app-network
    restart: always
    healthcheck:
      test:
        ["CMD", "curl", "--silent", "--fail", "http://localhost:4040/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 10s

  promtail:
    image: grafana/promtail:2.5.0
    container_name: promtail
    volumes:
      - ./nodeLogs:/var/log/node-app
      - ./promtail/config.yml:/etc/promtail/config.yml
    networks:
      - app-network
    depends_on:
      - minio
    restart: always

  mongo:
    image: mongo:latest
    container_name: mongoDB

    command: ["mongod", "--replSet", "rs0"]
    ports:
      - "27017:27017"

    volumes:
      - ./data/db:/data/db
    restart: always
    networks:
      - app-network
  loki:
    image: grafana/loki:2.5.0
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - app-network
    restart: always

  grafana:
    image: grafana/grafana:8.3.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_ROOT_USER: "test"
      MINIO_ROOT_PASSWORD: "test1234"
      MINIO_LOG_DIR: "/var/log/"
    ports:
      - "9000:9000"
      - "9001:9001"

    networks:
      - app-network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 10s
    command: server --address ":9000" --console-address ":9001" --json /data

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network
    restart: always
    depends_on:
      - minio
      - node-app
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

  open-telemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: open-telemetry-collector
    volumes:
      - ./otel-config.yaml:/otel-local-config.yaml
    command: ["--config", "/otel-local-config.yaml"]
    ports:
      - "4317:4317" # gRPC endpoint for OpenTelemetry SDKs to send traces
      - "55680:55680" # HTTP endpoint for OpenTelemetry SDKs to send traces
    networks:
      - app-network
    restart: always
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411" # Expose Zipkin UI on port 9411
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  minio-data:
    driver: minio
